<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Judge</title>
  <link rel="icon" href="favicon.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Source+Serif+4:ital,wght@1,600;1,700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --gold: #ffcc00;
      --bg: #000814;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: #fff;
      font-family: Oswald, Impact, "Arial Narrow", sans-serif;
    }

    body {
      padding: max(16px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom));
    }

    header, main {
      width: min(40rem, 100%);
      margin: 0 auto;
    }

    h1 {
      margin: 0;
      color: var(--gold);
      font-size: 1.4rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    #room-name, #status, #meta, #privacy, #empty, #source {
      margin: 8px 0 0;
      text-align: center;
    }

    #room-name {
      letter-spacing: 0.28em;
      color: rgba(255, 255, 255, 0.7);
    }

    #status {
      font-size: clamp(1.3rem, 4vw, 2rem);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    #meta, #privacy {
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.62);
    }

    #clock {
      margin: 0;
      color: var(--gold);
      font-size: clamp(2.4rem, 8vw, 4rem);
      line-height: 1;
      text-align: center;
    }

    #clock[hidden] { display: none; }

    #burn {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 5;
      height: 14px;
      background: rgba(255, 255, 255, 0.16);
      pointer-events: none;
    }

    #burn[hidden] { display: none; }

    #burn-fill {
      width: 100%;
      height: 100%;
      transform-origin: left center;
      background: var(--gold);
    }

    #burn.warn #burn-fill { background: #ff8a00; }
    #burn.urgent #burn-fill { background: #e10600; }

    #burn.urgent {
      animation: burn-pulse 0.4s ease-in-out infinite;
    }

    @keyframes burn-pulse {
      50% { filter: brightness(1.45); }
    }

    @media (prefers-reduced-motion: reduce) {
      #burn.urgent { animation: none; }
    }

    #block-default {
      width: 100%;
      min-height: 48px;
      margin-top: 14px;
    }

    #block-default[aria-pressed="true"] {
      background: var(--gold);
      color: #111;
    }

    #hold {
      width: 100%;
      min-height: 96px;
      margin-top: 8px;
      padding: 16px;
      font-size: clamp(1.2rem, 3vw, 1.6rem);
      touch-action: none;
      user-select: none;
    }

    #hold.down {
      background: var(--gold);
      color: #111;
    }

    .label {
      margin: 18px 0 6px;
      color: var(--gold);
      font-size: 0.78rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      text-align: center;
    }

    .clue-text {
      margin: 0;
      font-family: "Source Serif 4", Georgia, serif;
      font-style: italic;
      font-weight: 600;
      line-height: 1.3;
      text-align: center;
      text-wrap: balance;
    }

    #answer {
      font-size: clamp(1.3rem, 3vw, 1.8rem);
    }

    #response {
      color: var(--gold);
      font-size: clamp(1.8rem, 4.4vw, 2.6rem);
    }

    #source {
      color: var(--gold);
    }

    #source a { color: inherit; }

    #empty {
      font-size: 1.4rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    #actions, #scores {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-top: 16px;
    }

    button {
      appearance: none;
      border: 2px solid var(--gold);
      border-radius: 4px;
      background: #111;
      color: var(--gold);
      font: inherit;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.35;
      cursor: default;
    }

    #actions button, .award button {
      min-height: 48px;
      padding: 10px 14px;
    }

    .award {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      min-width: 9rem;
      padding: 8px;
      border-radius: 4px;
    }

    .award strong {
      max-width: 10rem;
      overflow: hidden;
      font-size: 0.85rem;
      letter-spacing: 0.08em;
      text-overflow: ellipsis;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .award b {
      font-size: 1.4rem;
    }

    .award div {
      display: flex;
      gap: 6px;
    }

    .award button {
      min-width: 64px;
      border-color: #fff;
      font-size: 1.6rem;
      font-weight: 700;
    }

    .award.offline {
      position: relative;
      box-shadow:
        0 0 0 3px #000,
        0 0 0 6px #ffcc00,
        0 0 0 9px #e10600;
    }

    .award.offline::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: rgba(0, 0, 0, 0.28);
      pointer-events: none;
    }

    .award input {
      width: 6.2rem;
      margin: 0;
      padding: 0 4px;
      border: 2px solid transparent;
      border-radius: 4px;
      background: transparent;
      color: inherit;
      font: inherit;
      font-size: 1.6rem;
      font-weight: 700;
      text-align: center;
    }

    .award input:hover,
    .award input:focus {
      border-color: currentColor;
      background: rgba(0, 0, 0, 0.16);
      outline: none;
    }

    #finish {
      width: min(40rem, 100%);
      margin: 28px auto 0;
      padding-top: 16px;
      border-top: 1px solid rgba(255, 204, 0, 0.35);
      text-align: center;
    }

    #finish p {
      margin: 0 0 10px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    #finish button {
      min-height: 48px;
      margin: 0 4px;
      padding: 10px 14px;
    }

    #finish-yes {
      background: var(--gold);
      color: #111;
    }

    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <header>
    <h1>Judge</h1>
    <p id="room-name" hidden></p>
    <p id="status">Connecting</p>
    <p id="clock" hidden></p>
    <div id="burn" hidden aria-hidden="true"><div id="burn-fill"></div></div>
    <button id="block-default" type="button" hidden aria-pressed="false">Block by default: off</button>
    <button id="hold" type="button" hidden aria-pressed="false">Hold to block buzzers</button>
  </header>
  <main>
    <p id="empty" hidden>Open a clue on the board.</p>
    <p id="meta" hidden></p>
    <p id="privacy" hidden></p>
    <p class="label" id="answer-label" hidden>On the board</p>
    <p id="answer" class="clue-text" hidden></p>
    <p class="label" id="response-label" hidden>Response</p>
    <p id="response" class="clue-text" hidden></p>
    <p id="source" hidden></p>
    <div id="actions"></div>
    <div id="scores"></div>
  </main>
  <div id="finish" hidden>
    <button id="finish-open" type="button">End game</button>
    <div id="finish-confirm" hidden>
      <p>Show final scores? Clues still on the board stay unplayed.</p>
      <button id="finish-yes" type="button">End now</button>
      <button id="finish-no" type="button">Keep playing</button>
    </div>
    <p id="finish-note" hidden>Final scores are on the board.</p>
  </div>
  <script>
    (function () {
      const COLORS = [
        { id: "red", label: "Red", hex: "#e11d2e" },
        { id: "blue", label: "Blue", hex: "#2f6bff" },
        { id: "green", label: "Green", hex: "#18a558" },
        { id: "yellow", label: "Yellow", hex: "#ffe14a" },
        { id: "orange", label: "Orange", hex: "#ff8a00" },
        { id: "purple", label: "Purple", hex: "#9b4dff" },
        { id: "pink", label: "Pink", hex: "#ff4f9a" },
        { id: "white", label: "White", hex: "#f7f7f7" }
      ];
      const CODE = /^[ABCDEFGHJKLMNPQRSTUVWXYZ23456789]{4}$/;
      const ANSWER_MS = 10000;
      const params = new URLSearchParams(location.search);
      const roomCode = (params.get("room") || "").toUpperCase();
      const token = params.get("token") || "";
      const roomName = document.getElementById("room-name");
      const statusEl = document.getElementById("status");
      const clockEl = document.getElementById("clock");
      const blockDefaultBtn = document.getElementById("block-default");
      const holdBtn = document.getElementById("hold");
      const emptyEl = document.getElementById("empty");
      const metaEl = document.getElementById("meta");
      const privacyEl = document.getElementById("privacy");
      const answerLabel = document.getElementById("answer-label");
      const answerEl = document.getElementById("answer");
      const responseLabel = document.getElementById("response-label");
      const responseEl = document.getElementById("response");
      const sourceEl = document.getElementById("source");
      const actionsEl = document.getElementById("actions");
      const scoresEl = document.getElementById("scores");
      const finishEl = document.getElementById("finish");
      const finishOpen = document.getElementById("finish-open");
      const finishConfirm = document.getElementById("finish-confirm");
      const finishYes = document.getElementById("finish-yes");
      const finishNo = document.getElementById("finish-no");
      const finishNote = document.getElementById("finish-note");
      let socket = null;
      let state = { teams: [], names: {}, out: [], taken: [] };
      let receivedAt = 0;
      let clockTimer = null;
      let pending = false;
      let ended = false;
      let endedOn = "";
      let holding = false;
      let openedClue = "";
      let pointerDown = false;
      let keyDown = false;
      let activePointer = null;

      function colorById(id) {
        for (let i = 0; i < COLORS.length; i++) {
          if (COLORS[i].id === id) {
            return COLORS[i];
          }
        }
        return null;
      }

      function inkFor(hex) {
        const rgb = String(hex).replace("#", "");
        const r = parseInt(rgb.slice(0, 2), 16);
        const g = parseInt(rgb.slice(2, 4), 16);
        const b = parseInt(rgb.slice(4, 6), 16);
        return ((0.299 * r) + (0.587 * g) + (0.114 * b)) / 255 > 0.72 ? "#111" : "#fff";
      }

      function send(message) {
        if (socket && socket.readyState === 1) {
          socket.send(JSON.stringify(message));
        }
      }

      function sendAction(action) {
        if (pending) {
          return;
        }
        pending = true;
        send(action);
        render();
        setTimeout(function () {
          pending = false;
          render();
        }, 800);
      }

      function secondsLeft() {
        if (!state.winner || !state.lockedAt || !state.now) {
          return null;
        }
        const elapsed = (state.now - state.lockedAt) + (Date.now() - receivedAt);
        return Math.max(0, (ANSWER_MS - elapsed) / 1000);
      }

      function ensureClock() {
        if (clockTimer || !state.winner || !state.lockedAt || secondsLeft() <= 0) {
          return;
        }
        clockTimer = setInterval(function () {
          paintClock();
          const left = secondsLeft();
          if (left === null || left <= 0) {
            clearInterval(clockTimer);
            clockTimer = null;
          }
        }, 200);
      }

      function paintClock() {
        const burn = document.getElementById("burn");
        const fill = document.getElementById("burn-fill");
        const left = secondsLeft();
        if (!state.winner || left === null) {
          clockEl.hidden = true;
          burn.hidden = true;
          burn.classList.remove("warn", "urgent");
          return;
        }
        clockEl.hidden = false;
        clockEl.textContent = left > 0 ? String(Math.ceil(left)) : "Time";
        const fraction = Math.max(0, left / (ANSWER_MS / 1000));
        burn.hidden = false;
        fill.style.transform = "scaleX(" + fraction.toFixed(4) + ")";
        burn.classList.toggle("urgent", fraction <= 0.3);
        burn.classList.toggle("warn", fraction > 0.3 && fraction <= 0.6);
      }

      function personName(id, fallback) {
        if (fallback) {
          return fallback;
        }
        if (state.names && state.names[id]) {
          return state.names[id];
        }
        const color = colorById(id);
        return color ? color.label : id;
      }

      function clue() {
        return state.board && state.board.clue ? state.board.clue : null;
      }

      function scoreRows() {
        const listed = state.board && Array.isArray(state.board.scores) ? state.board.scores : [];
        const byId = {};
        listed.forEach(function (row) {
          if (row && row.id) {
            byId[row.id] = row;
          }
        });
        const ids = Array.isArray(state.teams) && state.teams.length ? state.teams : Object.keys(byId);
        return ids.map(function (id) {
          const row = byId[id] || {};
          return {
            id: id,
            score: Number.isFinite(Number(row.score)) ? Number(row.score) : 0,
            name: personName(id, row.name || "")
          };
        });
      }

      function actionButton(label, action) {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = label;
        button.disabled = pending;
        button.addEventListener("click", function () {
          sendAction(action);
        });
        return button;
      }

      function safeUrl(url) {
        return /^https?:\/\//i.test(url || "") ? url : "";
      }

      function canBlock() {
        const current = clue();
        return !!(current && current.step === "answer" && !state.winner);
      }

      function clueKey() {
        const current = clue();
        if (!current || current.step !== "answer") {
          return "";
        }
        return current.id || "";
      }

      function blockPreferred() {
        return !!state.blockDefault;
      }

      function paintBlockDefault(on) {
        blockDefaultBtn.hidden = false;
        blockDefaultBtn.setAttribute("aria-pressed", on ? "true" : "false");
        blockDefaultBtn.textContent = on ? "Block by default: on" : "Block by default: off";
      }

      function unsteady(id) {
        const taken = Array.isArray(state.taken) ? state.taken : [];
        const stale = Array.isArray(state.stale) ? state.stale : [];
        const seen = Array.isArray(state.seen) ? state.seen : [];
        if (stale.indexOf(id) !== -1) {
          return true;
        }
        return seen.indexOf(id) !== -1 && taken.indexOf(id) === -1;
      }

      function commitScore(input, id) {
        const next = Math.floor(Number(input.value));
        if (!Number.isFinite(next)) {
          return;
        }
        const clamped = Math.max(-1000000, Math.min(1000000, next));
        input.value = String(clamped);
        send({ type: "action", action: "set-score", color: id, score: clamped });
      }

      function syncHold() {
        const open = canBlock();
        if (blockPreferred()) {
          if (holding) {
            holding = false;
            pointerDown = false;
            keyDown = false;
            send({ type: "release" });
          }
          holdBtn.hidden = !open;
          const blocked = !!state.held;
          holdBtn.classList.toggle("down", blocked);
          holdBtn.setAttribute("aria-pressed", blocked ? "true" : "false");
          holdBtn.textContent = blocked ? "Tap to open buzzers" : "Tap to block buzzers";
          return;
        }
        const want = open && (pointerDown || keyDown);
        if (holding !== want) {
          holding = want;
          send({ type: holding ? "hold" : "release" });
        }
        holdBtn.hidden = !open;
        holdBtn.classList.toggle("down", holding);
        holdBtn.setAttribute("aria-pressed", holding ? "true" : "false");
        holdBtn.textContent = holding ? "Buzzers blocked" : "Hold to block buzzers";
      }

      function maintainDefaultBlock() {
        if (!blockPreferred() || !canBlock()) {
          return;
        }
        const key = clueKey();
        if (openedClue && openedClue !== key) {
          openedClue = "";
        }
        if (openedClue === key || state.held) {
          return;
        }
        send({ type: "block" });
      }

      function clearHold() {
        pointerDown = false;
        keyDown = false;
        activePointer = null;
        syncHold();
      }

      function render() {
        const current = clue();
        const winnerName = state.winner ? personName(state.winner, "") : "";
        syncHold();
        roomName.hidden = false;
        roomName.textContent = roomCode;
        if (state.winner) {
          statusEl.textContent = winnerName + " buzzed";
        } else if ((holding || state.held) && current && current.step === "answer") {
          statusEl.textContent = "Buzzers blocked";
        } else if (state.armed) {
          statusEl.textContent = "Buzzers open";
        } else {
          statusEl.textContent = current ? "Clue is up" : "Waiting for a clue";
        }
        paintClock();
        const taken = Array.isArray(state.taken) ? state.taken : [];
        const out = Array.isArray(state.out) ? state.out : [];
        const bits = [];
        if (taken.length) {
          bits.push("In: " + taken.map(function (id) { return personName(id, ""); }).join(", "));
        }
        if (out.length) {
          bits.push("Out: " + out.map(function (id) { return personName(id, ""); }).join(", "));
        }
        if (bits.length) {
          statusEl.textContent += " · " + bits.join(" · ");
        }
        emptyEl.hidden = !!current;
        metaEl.hidden = !current;
        privacyEl.hidden = !current;
        answerLabel.hidden = !current;
        answerEl.hidden = !current;
        responseLabel.hidden = !current;
        responseEl.hidden = !current;
        if (current) {
          const round = state.board && state.board.round ? state.board.round + " · " : "";
          metaEl.textContent = round + current.category + " · " + String(current.value).replace(/^\$/, "");
          if (state.winner && current.step === "answer") {
            privacyEl.textContent = "Score this buzz with + or −";
          } else if (current.step === "answer") {
            privacyEl.textContent = "No buzz yet. Show the answer to finish with no points awarded.";
          } else {
            privacyEl.textContent = "Response is on the projector";
          }
          answerEl.textContent = current.answer;
          responseEl.textContent = current.question;
          const href = safeUrl(current.url);
          sourceEl.hidden = !current.citation && !href;
          sourceEl.textContent = "";
          if (current.citation || href) {
            if (href) {
              const link = document.createElement("a");
              link.href = href;
              link.target = "_blank";
              link.rel = "noopener noreferrer";
              link.textContent = current.citation || "Source";
              sourceEl.appendChild(link);
            } else {
              sourceEl.textContent = current.citation;
            }
          }
        } else {
          sourceEl.hidden = true;
        }
        const buzzing = !!(state.winner && current && current.step === "answer");
        actionsEl.innerHTML = "";
        if (current && current.step === "answer" && !buzzing) {
          actionsEl.appendChild(actionButton("Show answer", { type: "action", action: "reveal" }));
          actionsEl.appendChild(actionButton("Put clue back", { type: "action", action: "dismiss" }));
        } else if (current && current.step === "question") {
          actionsEl.appendChild(actionButton("Back to board", { type: "action", action: "close" }));
        }
        const clueId = current && current.id ? current.id : "";
        if (ended && clueId && clueId !== endedOn) {
          ended = false;
        }
        finishNote.hidden = !ended;
        finishEl.hidden = false;
        finishOpen.hidden = !finishConfirm.hidden;
        finishOpen.disabled = pending;
        finishYes.disabled = pending;
        finishNo.disabled = pending;
        paintBlockDefault(!!state.blockDefault);
        const editingScore = document.activeElement && document.activeElement.dataset && document.activeElement.dataset.scoreEdit;
        if (!editingScore) {
          scoresEl.innerHTML = "";
          const amount = current ? Number(current.amount) : 0;
          const scoring = !!(buzzing && amount);
          scoreRows().forEach(function (row) {
            const color = colorById(row.id);
            if (!color) {
              return;
            }
            const ink = inkFor(color.hex);
            const card = document.createElement("div");
            card.className = "award" + (unsteady(row.id) ? " offline" : "");
            card.style.background = color.hex;
            card.style.color = ink;
            if (unsteady(row.id)) {
              card.title = row.name + " has connection trouble";
            }
            const name = document.createElement("strong");
            name.textContent = row.name;
            const value = document.createElement("input");
            value.type = "number";
            value.inputMode = "numeric";
            value.dataset.scoreEdit = row.id;
            value.value = String(row.score);
            value.defaultValue = String(row.score);
            value.setAttribute("aria-label", row.name + " score");
            value.addEventListener("change", function () {
              commitScore(value, row.id);
            });
            value.addEventListener("keydown", function (event) {
              if (event.key === "Enter") {
                event.preventDefault();
                commitScore(value, row.id);
                value.blur();
              } else if (event.key === "Escape") {
                value.value = value.defaultValue;
                value.blur();
              }
            });
            card.appendChild(name);
            card.appendChild(value);
            if (scoring && (!buzzing || row.id === state.winner)) {
              const controls = document.createElement("div");
              controls.appendChild(scoreButton(ink, "+", amount, row.id));
              controls.appendChild(scoreButton(ink, "−", -amount, row.id));
              card.appendChild(controls);
            }
            scoresEl.appendChild(card);
          });
        }
        maintainDefaultBlock();
      }

      function scoreButton(ink, symbol, delta, color) {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = symbol;
        button.style.background = "#111";
        button.style.color = "#fff";
        button.style.borderColor = "#fff";
        button.disabled = pending;
        button.addEventListener("click", function () {
          sendAction({ type: "action", action: "award", color: color, delta: delta });
        });
        return button;
      }

      function connect() {
        const protocol = location.protocol === "https:" ? "wss:" : "ws:";
        const next = new WebSocket(protocol + "//" + location.host + "/room?code=" + roomCode + "&role=judge&token=" + encodeURIComponent(token));
        socket = next;
        next.addEventListener("open", function () {
          statusEl.textContent = "Waiting for a clue";
          finishEl.hidden = false;
          if (holding) {
            send({ type: "hold" });
          }
        });
        next.addEventListener("message", function (event) {
          let data;
          try {
            data = JSON.parse(event.data);
          } catch (error) {
            return;
          }
          if (data.type !== "state") {
            return;
          }
          pending = false;
          receivedAt = Date.now();
          state = data;
          render();
          ensureClock();
        });
        next.addEventListener("close", function () {
          if (socket !== next) {
            return;
          }
          statusEl.textContent = "Reconnecting";
          setTimeout(connect, 1000);
        });
      }

      finishOpen.addEventListener("click", function () {
        finishOpen.hidden = true;
        finishConfirm.hidden = false;
        finishNote.hidden = true;
        finishYes.focus();
      });

      finishNo.addEventListener("click", function () {
        finishConfirm.hidden = true;
        finishOpen.hidden = false;
        finishNote.hidden = !ended;
      });

      finishYes.addEventListener("click", function () {
        const current = clue();
        ended = true;
        endedOn = current && current.id ? current.id : "";
        finishConfirm.hidden = true;
        finishOpen.hidden = false;
        finishNote.hidden = false;
        sendAction({ type: "action", action: "finish" });
      });

      function endPointer(event) {
        if (activePointer === null || event.pointerId !== activePointer) {
          return;
        }
        activePointer = null;
        pointerDown = false;
        syncHold();
      }

      blockDefaultBtn.addEventListener("click", function () {
        const next = blockDefaultBtn.getAttribute("aria-pressed") !== "true";
        if (next) {
          openedClue = "";
        }
        paintBlockDefault(next);
        send({ type: "block-default", on: next });
      });

      holdBtn.addEventListener("click", function () {
        if (!blockPreferred() || holdBtn.hidden) {
          return;
        }
        if (state.held) {
          openedClue = clueKey();
          send({ type: "unblock" });
          return;
        }
        openedClue = "";
        send({ type: "block" });
      });

      holdBtn.addEventListener("pointerdown", function (event) {
        if (blockPreferred() || event.button !== 0 || activePointer !== null) {
          return;
        }
        event.preventDefault();
        activePointer = event.pointerId;
        holdBtn.setPointerCapture(event.pointerId);
        pointerDown = true;
        syncHold();
      });
      holdBtn.addEventListener("pointerup", endPointer);
      holdBtn.addEventListener("pointercancel", endPointer);
      holdBtn.addEventListener("contextmenu", function (event) {
        event.preventDefault();
      });

      document.addEventListener("keydown", function (event) {
        if (event.key !== " " || event.repeat || holdBtn.hidden) {
          return;
        }
        const target = event.target;
        if (target && (target.matches("input, textarea") || (target !== holdBtn && target !== document.body && target !== document.documentElement))) {
          return;
        }
        if (blockPreferred()) {
          event.preventDefault();
          if (state.held) {
            openedClue = clueKey();
            send({ type: "unblock" });
          } else {
            openedClue = "";
            send({ type: "block" });
          }
          return;
        }
        if (keyDown) {
          return;
        }
        event.preventDefault();
        keyDown = true;
        syncHold();
      });

      document.addEventListener("keyup", function (event) {
        if (event.key !== " " || !keyDown) {
          return;
        }
        event.preventDefault();
        keyDown = false;
        syncHold();
      });

      window.addEventListener("blur", clearHold);
      document.addEventListener("visibilitychange", function () {
        if (document.visibilityState !== "visible") {
          clearHold();
        }
      });

      if (!CODE.test(roomCode) || token.length < 16) {
        statusEl.textContent = "Open Judge window from the board menu.";
        return;
      }
      connect();
    })();
  </script>
</body>
</html>
