<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Buzz</title>
  <link rel="icon" href="favicon.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Source+Serif+4:wght@600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --gold: #ffcc00;
      --bg: #000814;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: #fff;
      font-family: Oswald, Impact, "Arial Narrow", sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100%;
      padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
    }

    h1 {
      margin: 0;
      color: var(--gold);
      font-size: 1.4rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      text-align: center;
    }

    #room-name {
      margin: 6px 0 0;
      text-align: center;
      letter-spacing: 0.28em;
      color: rgba(255, 255, 255, 0.75);
    }

    #status {
      margin: 18px 0 8px;
      text-align: center;
      font-size: clamp(1.4rem, 6vw, 2.4rem);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    #source {
      margin: 0 auto 12px;
      max-width: 28rem;
      color: var(--gold);
      font-size: 1.05rem;
      line-height: 1.35;
      text-align: center;
    }

    #source a {
      color: inherit;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    form, #colors, #buzz-wrap {
      width: min(28rem, 100%);
      margin: 0 auto;
    }

    label {
      display: block;
      margin-bottom: 8px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--gold);
    }

    input {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid var(--gold);
      border-radius: 4px;
      background: #111;
      color: #fff;
      font: inherit;
      font-size: 2rem;
      letter-spacing: 0.28em;
      text-align: center;
      text-transform: uppercase;
    }

    #team-name {
      margin-bottom: 14px;
      font-size: 1.35rem;
      letter-spacing: 0.04em;
      text-transform: none;
    }

    #setup {
      width: min(28rem, 100%);
      margin: 0 auto;
    }

    button {
      appearance: none;
      font: inherit;
      cursor: pointer;
    }

    #join, .color-choice, #buzz {
      border-radius: 4px;
    }

    #join {
      width: 100%;
      margin-top: 12px;
      padding: 14px 18px;
      border: 2px solid var(--gold);
      background: var(--gold);
      color: #111;
      font-size: 1.3rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    #colors {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .color-choice {
      min-height: 72px;
      border: 3px solid #fff;
      font-size: 1.4rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .color-choice:disabled {
      opacity: 0.35;
      cursor: default;
    }

    #buzz-wrap {
      flex: 1;
      display: flex;
      align-items: stretch;
      width: 100%;
      max-width: none;
    }

    #buzz {
      flex: 1;
      width: 100%;
      border: 4px solid #fff;
      font-size: clamp(3rem, 14vw, 7rem);
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    #buzz:disabled {
      cursor: default;
      filter: saturate(0.7);
    }

    #error {
      margin: 12px auto 0;
      max-width: 28rem;
      color: var(--gold);
      text-align: center;
    }

    #menu {
      position: fixed;
      top: max(12px, env(safe-area-inset-top));
      right: max(12px, env(safe-area-inset-right));
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    #menu-toggle {
      display: flex;
      flex-direction: column;
      justify-content: space-evenly;
      align-items: center;
      width: 44px;
      height: 44px;
      padding: 8px 0;
      border: 2px solid var(--gold);
      border-radius: 4px;
      background: #111;
      color: var(--gold);
    }

    #menu-toggle span {
      display: block;
      width: 5px;
      height: 5px;
      background: currentColor;
      border-radius: 50%;
    }

    #menu-toggle:hover,
    #menu-toggle:focus-visible,
    #credits-open:hover,
    #credits-open:focus-visible,
    #credits-close:hover,
    #credits-close:focus-visible,
    #save-name:hover,
    #save-name:focus-visible {
      background: var(--gold);
      color: #111;
    }

    #menu-panel {
      width: min(18rem, calc(100vw - 24px));
      margin-top: 8px;
      padding: 8px;
      background: #111;
      border: 2px solid var(--gold);
      border-radius: 4px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.5);
    }

    #credits-open,
    #credits-close,
    #save-name {
      width: 100%;
      padding: 10px 14px;
      border: 2px solid var(--gold);
      border-radius: 4px;
      background: #111;
      color: var(--gold);
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .menu-section {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 204, 0, 0.35);
    }

    #menu-name {
      margin-bottom: 8px;
      font-size: 1.15rem;
      letter-spacing: 0.04em;
      text-transform: none;
    }

    #name-note {
      margin: 8px 0 0;
      text-align: center;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--gold);
    }

    #credits {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(0, 0, 0, 0.72);
    }

    .credits-card {
      width: min(28rem, 100%);
      max-height: calc(100vh - 48px);
      overflow: auto;
      padding: 20px 22px 22px;
      border: 2px solid var(--gold);
      border-radius: 4px;
      background: #111;
    }

    .credits-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 12px;
    }

    #credits-title {
      margin: 0;
      color: var(--gold);
      font-size: 1.4rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    #credits-close {
      width: auto;
      flex-shrink: 0;
    }

    .credits-card p {
      margin: 0 0 10px;
      font-family: "Source Serif 4", Georgia, serif;
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: 0;
      line-height: 1.45;
      text-transform: none;
    }

    .credits-card a {
      color: var(--gold);
    }

    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div id="menu">
    <button id="menu-toggle" type="button" aria-expanded="false" aria-controls="menu-panel" aria-label="Menu">
      <span aria-hidden="true"></span>
      <span aria-hidden="true"></span>
      <span aria-hidden="true"></span>
    </button>
    <div id="menu-panel" hidden>
      <button id="credits-open" type="button">Credits</button>
      <div class="menu-section">
        <label for="menu-name">Team name</label>
        <input id="menu-name" maxlength="16" autocomplete="nickname" placeholder="Optional" />
        <button id="save-name" type="button">Save name</button>
        <p id="name-note" hidden>Saved</p>
      </div>
    </div>
  </div>
  <h1>Buzz</h1>
  <p id="room-name" hidden></p>
  <p id="status">Join a room</p>
  <p id="source" hidden></p>
  <form id="join-form">
    <label for="code">Room code</label>
    <input id="code" name="code" maxlength="4" autocapitalize="characters" autocomplete="off" enterkeyhint="join" />
    <button id="join" type="submit">Join</button>
  </form>
  <div id="setup" hidden>
    <label for="team-name">Team name</label>
    <input id="team-name" maxlength="16" autocomplete="nickname" placeholder="Optional" />
    <div id="colors"></div>
  </div>
  <div id="buzz-wrap" hidden>
    <button id="buzz" type="button" disabled>Wait</button>
  </div>
  <p id="error" hidden></p>
  <div id="credits" hidden>
    <div class="credits-card" role="dialog" aria-modal="true" aria-labelledby="credits-title">
      <div class="credits-head">
        <h2 id="credits-title">Credits</h2>
        <button id="credits-close" type="button">Close</button>
      </div>
      <p>Made by <a href="https://www.theallsparks.org" target="_blank" rel="noopener noreferrer">The Allsparks</a>, FIRST Tech Challenge team 36117. <a href="https://www.theallsparks.org/support-us/donations" target="_blank" rel="noopener noreferrer">Donate</a> through Hack Club, a 501(c)(3).</p>
      <p>Unofficial classroom board. Jeopardy! is a trademark of Jeopardy Productions, Inc.</p>
      <p>Think music: <a href="https://archive.org/details/tvtunes_29826" target="_blank" rel="noopener noreferrer">Internet Archive</a>.</p>
    </div>
  </div>
  <script>
    (function () {
      const COLORS = [
        { id: "red", label: "Red", hex: "#e11d2e" },
        { id: "blue", label: "Blue", hex: "#2f6bff" },
        { id: "green", label: "Green", hex: "#18a558" },
        { id: "yellow", label: "Yellow", hex: "#ffe14a" },
        { id: "orange", label: "Orange", hex: "#ff8a00" },
        { id: "purple", label: "Purple", hex: "#9b4dff" },
        { id: "pink", label: "Pink", hex: "#ff4f9a" },
        { id: "white", label: "White", hex: "#f7f7f7" }
      ];
      const CODE = /^[ABCDEFGHJKLMNPQRSTUVWXYZ23456789]{4}$/;
      const form = document.getElementById("join-form");
      const codeInput = document.getElementById("code");
      const nameInput = document.getElementById("team-name");
      const menu = document.getElementById("menu");
      const menuToggle = document.getElementById("menu-toggle");
      const menuPanel = document.getElementById("menu-panel");
      const menuName = document.getElementById("menu-name");
      const nameNote = document.getElementById("name-note");
      const credits = document.getElementById("credits");
      const creditsOpen = document.getElementById("credits-open");
      const creditsClose = document.getElementById("credits-close");
      const roomName = document.getElementById("room-name");
      const statusEl = document.getElementById("status");
      const sourceEl = document.getElementById("source");
      const setupEl = document.getElementById("setup");
      const colorsEl = document.getElementById("colors");
      const buzzWrap = document.getElementById("buzz-wrap");
      const buzzBtn = document.getElementById("buzz");
      const errorEl = document.getElementById("error");
      const ANSWER_MS = 10000;
      let socket = null;
      let roomCode = "";
      let state = { teams: [], taken: [], names: {}, armed: false, locked: false, winner: null, out: [], you: null };
      let announced = null;
      let receivedAt = 0;
      let clockTimer = null;

      function colorById(id) {
        for (let i = 0; i < COLORS.length; i++) {
          if (COLORS[i].id === id) {
            return COLORS[i];
          }
        }
        return null;
      }

      function inkFor(hex) {
        const rgb = String(hex).replace("#", "");
        const r = parseInt(rgb.slice(0, 2), 16);
        const g = parseInt(rgb.slice(2, 4), 16);
        const b = parseInt(rgb.slice(4, 6), 16);
        return ((0.299 * r) + (0.587 * g) + (0.114 * b)) / 255 > 0.72 ? "#111" : "#fff";
      }

      function showError(message) {
        errorEl.hidden = !message;
        errorEl.textContent = message || "";
      }

      function readCode() {
        const params = new URLSearchParams(location.search);
        const fromUrl = (params.get("room") || "").toUpperCase();
        let saved = "";
        try {
          saved = sessionStorage.getItem("buzz-room") || "";
        } catch (error) {
          saved = "";
        }
        const code = CODE.test(fromUrl) ? fromUrl : saved;
        if (CODE.test(code)) {
          codeInput.value = code;
        }
        try {
          nameInput.value = sessionStorage.getItem("buzz-name") || "";
        } catch (error) {
          nameInput.value = "";
        }
        menuName.value = nameInput.value;
      }

      function remember(code, color, name) {
        try {
          sessionStorage.setItem("buzz-room", code);
          if (color) {
            sessionStorage.setItem("buzz-color", color);
          } else {
            sessionStorage.removeItem("buzz-color");
          }
          if (typeof name === "string") {
            sessionStorage.setItem("buzz-name", name.slice(0, 16));
          }
        } catch (error) {
          // The buzzer still works for this page load.
        }
      }

      function savedColor() {
        try {
          return sessionStorage.getItem("buzz-color") || "";
        } catch (error) {
          return "";
        }
      }

      function savedName() {
        try {
          return sessionStorage.getItem("buzz-name") || "";
        } catch (error) {
          return "";
        }
      }

      function personName(id) {
        const named = state.names && state.names[id];
        if (named) {
          return named;
        }
        const color = colorById(id);
        return color ? color.label : id;
      }

      function secondsLeft() {
        if (!state.winner || !state.lockedAt || !state.now) {
          return null;
        }
        const elapsed = (state.now - state.lockedAt) + (Date.now() - receivedAt);
        return Math.max(0, (ANSWER_MS - elapsed) / 1000);
      }

      function clockSuffix() {
        const left = secondsLeft();
        if (left === null) {
          return "";
        }
        return left > 0 ? " · " + Math.ceil(left) : " · Time";
      }

      function ensureClock() {
        if (clockTimer || !state.winner || !state.lockedAt || secondsLeft() <= 0) {
          return;
        }
        clockTimer = setInterval(function () {
          paintClock();
          const left = secondsLeft();
          if (left === null || left <= 0) {
            clearInterval(clockTimer);
            clockTimer = null;
          }
        }, 200);
      }

      function paintClock() {
        const clock = clockSuffix();
        if (!state.you || !state.locked || !state.winner) {
          return;
        }
        if (state.winner === state.you) {
          statusEl.textContent = "You buzzed" + clock;
          buzzBtn.textContent = clock ? clock.replace(" · ", "") : personName(state.you);
          return;
        }
        statusEl.textContent = personName(state.winner) + " buzzed" + clock;
        buzzBtn.textContent = clock ? clock.replace(" · ", "") : "Locked";
      }

      function renderSource() {
        const source = state.source || null;
        const citation = source && source.citation ? source.citation : "";
        const url = source && /^https?:\/\//i.test(source.url || "") ? source.url : "";
        sourceEl.textContent = "";
        if (!citation && !url) {
          sourceEl.hidden = true;
          return;
        }
        sourceEl.hidden = false;
        if (!url) {
          sourceEl.textContent = citation;
          return;
        }
        const link = document.createElement("a");
        link.href = url;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = citation || "Source";
        sourceEl.appendChild(link);
      }

      function send(message) {
        if (socket && socket.readyState === 1) {
          socket.send(JSON.stringify(message));
        }
      }

      function openMenu() {
        menuName.value = nameInput.value;
        nameNote.hidden = true;
        menu.classList.add("open");
        menuPanel.hidden = false;
        menuToggle.setAttribute("aria-expanded", "true");
        menuToggle.setAttribute("aria-label", "Close menu");
        menuName.focus();
      }

      function closeMenu() {
        const restoreFocus = menuPanel.contains(document.activeElement);
        menu.classList.remove("open");
        menuPanel.hidden = true;
        menuToggle.setAttribute("aria-expanded", "false");
        menuToggle.setAttribute("aria-label", "Menu");
        if (restoreFocus) {
          menuToggle.focus();
        }
      }

      function openCredits() {
        closeMenu();
        credits.hidden = false;
        creditsClose.focus();
      }

      function closeCredits() {
        credits.hidden = true;
        menuToggle.focus();
      }

      function saveTeamName() {
        const name = menuName.value.slice(0, 16);
        menuName.value = name;
        nameInput.value = name;
        try {
          sessionStorage.setItem("buzz-name", name);
        } catch (error) {
          // The name still applies for this page load.
        }
        if (state.you) {
          remember(roomCode, state.you, name);
          send({ type: "claim", color: state.you, name: name });
        }
        nameNote.hidden = false;
      }

      function render() {
        const mine = state.you ? colorById(state.you) : null;
        const winner = state.winner ? colorById(state.winner) : null;
        form.hidden = true;
        roomName.hidden = false;
        roomName.textContent = roomCode;
        renderSource();
        if (!mine) {
          buzzWrap.hidden = true;
          setupEl.hidden = false;
          statusEl.textContent = state.teams.length ? "Pick your color" : "Waiting for teams";
          colorsEl.innerHTML = "";
          state.teams.forEach(function (id) {
            const color = colorById(id);
            if (!color) {
              return;
            }
            const button = document.createElement("button");
            button.type = "button";
            button.className = "color-choice";
            button.textContent = color.label;
            button.style.background = color.hex;
            button.style.color = inkFor(color.hex);
            button.disabled = state.taken.indexOf(id) !== -1;
            button.addEventListener("click", function () {
              const name = nameInput.value;
              remember(roomCode, "", name);
              send({ type: "claim", color: id, name: name });
            });
            colorsEl.appendChild(button);
          });
          return;
        }
        setupEl.hidden = true;
        colorsEl.innerHTML = "";
        buzzWrap.hidden = false;
        buzzBtn.style.background = mine.hex;
        buzzBtn.style.color = inkFor(mine.hex);
        const out = Array.isArray(state.out) ? state.out : [];
        const lockedOut = out.indexOf(mine.id) !== -1;
        const canBuzz = state.armed && !state.locked && !state.held && !lockedOut;
        const clock = clockSuffix();
        buzzBtn.disabled = !canBuzz;
        if (state.armed && lockedOut) {
          statusEl.textContent = "Locked out";
          buzzBtn.textContent = "Out";
        } else if (state.locked && state.winner === mine.id) {
          statusEl.textContent = "You buzzed" + clock;
          buzzBtn.textContent = clock ? clock.replace(" · ", "") : personName(mine.id);
        } else if (state.locked && winner) {
          statusEl.textContent = personName(state.winner) + " buzzed" + clock;
          buzzBtn.textContent = clock ? clock.replace(" · ", "") : "Locked";
        } else if (canBuzz) {
          statusEl.textContent = personName(mine.id);
          buzzBtn.textContent = "Buzz";
        } else if (state.armed && state.held) {
          statusEl.textContent = "Buzzers blocked";
          buzzBtn.textContent = "Wait";
        } else {
          statusEl.textContent = "Wait for the answer";
          buzzBtn.textContent = "Wait";
        }
        if (state.winner !== announced) {
          announced = state.winner;
          if (state.winner === mine.id && navigator.vibrate) {
            navigator.vibrate(80);
          }
        }
      }

      function connect(code) {
        roomCode = code;
        remember(code, savedColor());
        showError("");
        const protocol = location.protocol === "https:" ? "wss:" : "ws:";
        const next = new WebSocket(protocol + "//" + location.host + "/room?code=" + code + "&role=player");
        socket = next;
        next.addEventListener("open", function () {
          showError("");
          const color = savedColor();
          if (color) {
            send({ type: "claim", color: color, name: savedName() });
          }
        });
        next.addEventListener("message", function (event) {
          let data;
          try {
            data = JSON.parse(event.data);
          } catch (error) {
            return;
          }
          if (data.type === "error") {
            remember(code, "", nameInput.value);
            showError(data.message);
            return;
          }
          if (data.type !== "state") {
            return;
          }
          receivedAt = Date.now();
          state = data;
          if (data.you) {
            const named = data.names && data.names[data.you] ? data.names[data.you] : "";
            const drafting = menu.classList.contains("open") || document.activeElement === nameInput;
            if (!drafting) {
              nameInput.value = named;
              menuName.value = named;
            }
            remember(code, data.you, drafting ? nameInput.value : named);
          }
          render();
          ensureClock();
        });
        next.addEventListener("close", function () {
          if (socket !== next) {
            return;
          }
          statusEl.textContent = "Reconnecting";
          setTimeout(function () {
            connect(code);
          }, 1000);
        });
      }

      form.addEventListener("submit", function (event) {
        event.preventDefault();
        const code = codeInput.value.toUpperCase().replace(/[^A-Z2-9]/g, "");
        if (!CODE.test(code)) {
          showError("Enter the 4-character room code.");
          return;
        }
        history.replaceState(null, "", "/buzzer?room=" + code);
        connect(code);
      });

      buzzBtn.addEventListener("click", function () {
        buzzBtn.disabled = true;
        send({ type: "buzz" });
      });

      menuToggle.addEventListener("click", function () {
        if (menu.classList.contains("open")) {
          closeMenu();
          return;
        }
        openMenu();
      });

      nameInput.addEventListener("input", function () {
        menuName.value = nameInput.value;
        nameNote.hidden = true;
      });

      menuName.addEventListener("input", function () {
        nameInput.value = menuName.value;
        nameNote.hidden = true;
      });

      document.getElementById("save-name").addEventListener("click", saveTeamName);

      menuName.addEventListener("keydown", function (event) {
        if (event.key === "Enter") {
          event.preventDefault();
          saveTeamName();
        }
      });

      creditsOpen.addEventListener("click", openCredits);
      creditsClose.addEventListener("click", closeCredits);

      credits.addEventListener("click", function (event) {
        if (event.target === credits) {
          closeCredits();
        }
      });

      document.addEventListener("click", function (event) {
        if (!menu.classList.contains("open") || menu.contains(event.target)) {
          return;
        }
        closeMenu();
      });

      document.addEventListener("keydown", function (event) {
        if (event.key !== "Escape") {
          return;
        }
        if (!credits.hidden) {
          event.preventDefault();
          closeCredits();
          return;
        }
        if (menu.classList.contains("open")) {
          event.preventDefault();
          closeMenu();
        }
      });

      readCode();
      if (CODE.test(codeInput.value)) {
        connect(codeInput.value);
      }
    })();
  </script>
</body>
</html>
